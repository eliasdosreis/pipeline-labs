name: "Estrutura de diretorios e arquivos"

on:
  push:
    branches: [ main ]
  workflow_dispatch:


env:
    NODE_VERSION: '18'

jobs:
  demostrando-estruturas:
    name: "Demonstrando Estruturas Basica"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Codigo"
        uses: actions/checkout@v4

        - name: Mostrar estrutura .github/workflows
          run: |
            echo "Estrutura do diretório .github/workflows:"
            ls -R .github/workflows
            echo ""
            echo "Total de workflows: $(ls -1 .github/workflows | wc -l)"


        - name: Elementos Obrigatórios do Workflow
          run: |
            echo "Elementos Obrigatórios do Workflow:"
            echo "1. name: Nome do workflow"
            echo "2. on: Evento que dispara o workflow"
            echo "3. jobs: Conjunto de trabalhos a serem executados"
            echo ""
       