name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
      
jobs:
  exemplo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Executar Hello World
        run: echo "Hello, World!"

      - name: Mostrar informaçoes do Sistema
        run: |
          echo "Informações do Sistema:"
          uname -a
          lsb_release -a
          df -h
          free -m